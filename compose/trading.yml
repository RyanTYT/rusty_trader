# Trading stack: database + trading bot.
#
# Runtime contract only: this file references prebuilt images and never builds.
#
# Dev build:
#   docker compose --env-file .env -f compose/trading.yml -f compose/trading.build.yml build
#
# Start:
#   docker compose --env-file .env -f compose/trading.yml up -d
#
# The optional hotpath TUI is behind the "console" profile:
#   docker compose --env-file .env -f compose/trading.yml --profile console up -d
name: autotrader-trading

services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PW}
      - POSTGRES_DB=${DB_DB}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  trading-bot:
    image: rusty_trader/trading-bot:${IMAGE_TAG:-latest}
    restart: always
    platform: linux/amd64
    volumes:
      - ${IBC_CONFIG_PATH:-../infra/ib-gateway/IBCMacos-3.20.0/config.ini}:/IBCLinux-3.21.2/config.ini:ro
      - orders-data:/data/orders
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - DB_USERNAME=${DB_USER}
      - DB_PW=${DB_PW}
      - DB_DB=${DB_DB}
      - DATABASE_HOST=db
      - SERVER_URL=0.0.0.0:8000
      - HOTPATH_PROMETHEUS_HOST=0.0.0.0
      - HOTPATH_PROMETHEUS_PORT=6772
      - DISPLAY=:99
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - TRADING_TYPE=paper
      - RUST_BACKTRACE=1
      - ORDERS_FILE_PATH=/data/orders/orders.redb
    ports:
      - 7462:7462
      - 4002:4002
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/check-health"]
      interval: 60s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  # Attaches to trading-bot's network namespace, so it must live in this
  # Compose project. Keep it behind a profile so normal startups skip it.
  hotpath-console:
    image: rusty_trader/hotpath-console:${IMAGE_TAG:-latest}
    profiles: ["console"]
    network_mode: "service:trading-bot"
    stdin_open: true
    tty: true
    depends_on:
      trading-bot:
        condition: service_started

volumes:
  orders-data:
    name: autotrader_orders-data
    driver: local
  pgdata:
    name: autotrader_pgdata
    driver: local

networks:
  default:
    name: autotrader
    external: true
