global:
  resolve_timeout: 5m

# Route all alerts to the default no-op receiver. group_by clusters by
# alertname; group_wait delays the first notification; group_interval is the
# min time between notifications for the same group; repeat_interval is how
# often to re-notify if the alert is still firing.
route:
  receiver: 'default'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'default'

# To send notifications, copy this file to infra/alertmanager/alertmanager.yml
# (gitignored), add a Telegram receiver, and point the route at it:
#
#  - name: 'telegram'
#    telegram_configs:
#      - bot_token: 'YOUR_BOT_TOKEN_HERE'
#        chat_id: 123456789
#        send_resolved: true
#
# Then set ALERTMANAGER_CONFIG in .env or pass --alertmanager to deploy.sh.
