groups:
  - name: rusty_trader
    interval: 30s
    rules:
      # TIER 1 — IBKR order-submission WIRE latency = slippage risk.
      # Per-strategy series ({strat}_order_submit_ibkr_wire) isolate the IBKR
      # network round-trip from the DB spawn. Page if p99 over 500ms for 5m.
      - alert: OrderSubmitWireP99High
        expr: histogram_quantile(0.99, rate(hotpath_function_duration_seconds{function=~".*_order_submit_ibkr_wire"}[5m])) > 0.5
        for: 5m
        labels:
          severity: page
          tier: "1"
        annotations:
          summary: "order_submit IBKR wire p99 above 500ms for 5m (slippage risk)"
          description: "The IBKR submit_order wire call is slow. Compare {strat}_order_submit_total vs {strat}_order_submit_ibkr_wire to see if the DB spawn is also slow. Check IBKR connection / gateway health."

      # TIER 4 — thread DEATH detector. The spin loops fire every BAR_INTERVAL
      # while their thread is alive, continuously (unlike bar_update which only
      # fires during market hours). Zero spin-loop calls over 2m = dead/panicked.
      - alert: StrategyThreadDead
        expr: rate(hotpath_function_calls_total{function=~".*_strat_bar_rcv_spin_loop|producer_grouped_spin_loop"}[2m]) == 0
        for: 2m
        labels:
          severity: page
          tier: "4"
        annotations:
          summary: "A strategy or producer spin loop has stopped firing — the thread is dead/stalled"
          description: "Spin loops fire every BAR_INTERVAL while alive. Zero calls over 2m = thread not running. Check for a panic in the logs or an OS-thread crash."

      # TIER 5c — bars being dropped = blind trading.
      - alert: BarsMissedBlindTrading
        expr: max(hotpath_gauge{key=~"bar_missed_.*"}) > 0
        for: 1m
        labels:
          severity: page
          tier: "5"
        annotations:
          summary: "At least one contract missed bars from IBKR — trading blind to that contract"
          description: "Check bar_sub_errors_* for subscription failures and the IBKR connection health."

      # TIER 5a — spmc-ring full (consumer can't keep up). Sustained push
      # retries = the leading overload indicator.
      - alert: BarPushRetriesSustained
        expr: increase(hotpath_gauge_updates_total{key="bar_push_retries"}[5m]) > 10
        for: 5m
        labels:
          severity: warn
          tier: "5"
        annotations:
          summary: "Producer is retrying try_push (ring full) — strategy/db consumer is too slow"
          description: "Check the per-strategy bar_update p99 and the bar_arrival_lag gauge — a consumer is likely stalled or overloaded."
