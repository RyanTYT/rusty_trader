apiVersion: 1

# Dashboard provider — loads every JSON in /var/lib/grafana/dashboards
# (mounted from infra/grafana/dashboards on the host) on startup + on file
# change, so editing the JSON hot-reloads the dashboard.
providers:
  - name: "rusty_trader"
    orgId: 1
    folder: "rusty_trader"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
