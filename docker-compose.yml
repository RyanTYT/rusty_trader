services:
  tws:
    image: ib-gateway
    platform: linux/amd64
    restart: always
    build:
      context: ./IB
    stdin_open: true
    tty: true
    privileged: true
    security_opt:
      - seccomp:./IB/config/chrome.json
    devices:
      - /dev/snd/:/dev/snd/
    ipc: host
    network_mode: host
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix/:ro
      - ~/.Xauthority:/home/tws/.Xauthority:rw
      - /var/lib/usbmux:/var/lib/usbmux
      - /var/run/user/501/pulse:/run/user/501/pulse
      - /etc/asound.conf:/etc/asound.conf
      - ib-volume:/home/tws

  trading-bot:
    restart: always
    build:
      context: ./trading-app # assumes Dockerfile is in the root directory
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - ib-volume:/home/tws
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - DATABASE_HOST=db
      # - HOST=127.0.0.1
      # - SERVER_HOST=127.0.0.1
      # - PORT=8000
      - DISPLAY=:99
      # - DISPLAY=192.168.1.90:0
      # - RUST_BACKEND_URL=http://backend:4875
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - TRADING_TYPE=paper
    ports:
      - 7462:7462
      - 4002:4002
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/check-health"]
      interval: 60s
      timeout: 5s
      retries: 5
    depends_on:
      tws:
        condition: service_started
      db:
        condition: service_healthy
      autoheal:
        condition: service_started

  hotpath-console:
    build:
      context: ./hotpath-console
    network_mode: "service:trading-bot"
    stdin_open: true
    tty: true
    profiles: ["debug"] # excluded from a normal `docker compose up`
    depends_on:
      trading-bot:
        condition: service_started

  backend:
    build:
      context: ./backend # assumes Dockerfile is in the root directory
    restart: always
    platform: linux/amd64
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - SERVER_HOST=0.0.0.0
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - BEARER_TOKEN=${BACKEND_BEARER_TOKEN}
      - RUST_BACKTRACE=full
      - LLM_SERVICE_URL=http://llm_service:8001
      - TRADING_BOT_URL=${TRADING_BOT_URL}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
    ports:
      - 3000:3000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--tries=1",
          "-qO-",
          "http://localhost:3000/check-health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      llm_service:
        condition: service_healthy
    volumes:
      - knowledge_base:/data/knowledge_base
      - scraped_articles:/data/scraped_articles

  db:
    image: timescale/timescaledb:latest-pg17
    restart: always
    volumes:
      - ./postgres-data:/var/lib/postgresql/data # Mount a volume for persistent PostgreSQL data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PW}
      - POSTGRES_DB=${DB_DB}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-db:
    image: timescale/timescaledb:latest-pg17
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PW}
      - POSTGRES_DB=${DB_DB}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-trading-bot:
    restart: always
    build:
      context: ./trading-app
      dockerfile: Dockerfile.test
    platform: linux/amd64
    volumes:
      - ib-volume:/home/tws
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${TEST_TRADING_DB_URL}
      - DATABASE_HOST=test-db
      # - HOST=127.0.0.1
      # - SERVER_HOST=127.0.0.1
      # - PORT=8000
      - DISPLAY=:99
      - SQLX_OFFLINE=true
      # - DISPLAY=192.168.1.90:0
      # - RUST_BACKEND_URL=http://backend:4875
      - TRADING_TYPE=paper
    ports:
      - 7462:7462
      - 8000:8000
    depends_on:
      tws:
        condition: service_started
      test-db:
        condition: service_healthy

  # ── Rust Playwright scraper ───────────────────────────────────────────────
  scraper:
    build:
      context: ./scraper
    shm_size: "2gb"
    environment:
      - ARTICLES_PATH=/data/scraped_articles
      - LLM_SERVICE_URL=http://llm_service:8001
      - BEARER_TOKEN=${BACKEND_BEARER_TOKEN}
      - PLAYWRIGHT_BROWSERS_PATH=/home/appuser/.cache/ms-playwright
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - scraped_articles:/data/scraped_articles
      - playwright_cache:/home/appuser/.cache/ms-playwright
    depends_on:
      llm_service:
        condition: service_healthy
    restart: unless-stopped

  # ── Python LLM orchestration service ─────────────────────────────────────
  llm_service:
    build:
      context: ./llm_service
    ports:
      - 8001:8001 # internal only — not exposed to external network
    environment:
      - KNOWLEDGE_BASE_PATH=/data/knowledge_base
      - ARTICLES_PATH=/data/scraped_articles
      - SETTINGS_PATH=/data/settings
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BACKEND_URL=http://backend:3000
      - BEARER_TOKEN=${BACKEND_BEARER_TOKEN}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
    volumes:
      - knowledge_base:/data/knowledge_base
      - scraped_articles:/data/scraped_articles
      - llm_settings:/data/settings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  autoheal:
    deploy:
      replicas: 1
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
    image: willfarrell/autoheal:latest
    network_mode: none
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  ib-volume:
    driver: local

  knowledge_base:
    driver: local
    # On the host this lives at: /var/lib/docker/volumes/knowledge_base/_data
    # Back up with: docker run --rm -v knowledge_base:/data alpine tar czf - /data > kb_$(date +%Y%m%d).tar.gz
  scraped_articles:
    driver: local
  llm_settings:
    driver: local
  playwright_cache:
    driver: local
