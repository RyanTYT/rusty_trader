services:
  tws:
    image: ib-gateway-ibc
    platform: linux/amd64
    restart: "no"
    build:
      context: .
      dockerfile: infra/ib-gateway/Dockerfile.ibc
    network_mode: host
    user: "root"
    environment:
      - TRADING_MODE=paper
      - TZ=US/Eastern
      - DISPLAY=host.docker.internal:0
    volumes:
      - ./infra/ib-gateway/entrypoint-ibc.sh:/home/tws/entrypoint-ibc.sh:ro

  trading-bot:
    restart: always
    build:
      context: ./trading/trading-app # assumes Dockerfile is in the root directory
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - ib-volume:/home/tws
      - orders-data:/data/orders
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - DB_USERNAME=${DB_USER}
      - DB_PW=${DB_PW}
      - DB_DB=${DB_DB}
      - DATABASE_HOST=db
      - SERVER_URL=0.0.0.0:8000
      # - HOST=127.0.0.1
      # - SERVER_HOST=127.0.0.1
      # - PORT=8000
      # hotpath Prometheus exporter (0.25+, hotpath-prometheus feature).
      # Bind 0.0.0.0 so the prometheus sibling container can reach :6772
      # through the Docker bridge (default 127.0.0.1 is unreachable cross-container).
      - HOTPATH_PROMETHEUS_HOST=0.0.0.0
      - HOTPATH_PROMETHEUS_PORT=6772
      - DISPLAY=:99
      # - DISPLAY=192.168.1.90:0
      # - RUST_BACKEND_URL=http://backend:4875
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - TRADING_TYPE=paper
      - RUST_BACKTRACE=1
      - ORDERS_FILE_PATH=/data/orders/orders.redb
    ports:
      - 7462:7462
      - 4002:4002
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/check-health"]
      interval: 60s
      timeout: 5s
      retries: 5
    depends_on:
      tws:
        condition: service_started
      db:
        condition: service_healthy
      autoheal:
        condition: service_started

  hotpath-console:
    build:
      context: ./api/hotpath-console
    network_mode: "service:trading-bot"
    stdin_open: true
    tty: true
    depends_on:
      trading-bot:
        condition: service_started

  # ── Prometheus ──────────────────────────────────────────────────────────
  # Scrapes trading-bot:6772/metrics (hotpath's native Prom exporter, 0.25+).
  # Retains 30d; native histograms left off by default (classic FAST_BUCKETS
  # 250ns..10s already covers the Rust hot-path µs range well enough).
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    depends_on:
      trading-bot:
        condition: service_started

  # ── AlertManager ──────────────────────────────────────────────────────────
  # Lightweight (~30MB RAM) alerter — evaluates + routes alerts to Telegram.
  # Alert RULES live in Prometheus (infra/prometheus/rules.yml); AlertManager
  # only handles notification routing (the Telegram bot token + chat ID).
  # Config: infra/alertmanager/alertmanager.yml — fill in your bot token.
  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    ports:
      - 9093:9093  # optional UI (localhost:9093) for viewing silence state
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      prometheus:
        condition: service_started

  # ── Grafana (OPTIONAL — for the Tauri app's "Grafana" iframe view) ───────
  # Uncomment to enable the Grafana iframe toggle in the Tauri monitoring page.
  # NOT required for alerting (AlertManager handles that) — this is purely
  # for the optional Grafana dashboard view. ~100-200MB RAM.
  # grafana:
  #   image: grafana/grafana:latest
  #   restart: always
  #   ports:
  #     - 3001:3000
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
  #     - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
  #     - GF_AUTH_ANONYMOUS_ENABLED=true
  #     - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
  #     - GF_SECURITY_ALLOW_EMBEDDING=true  # removes X-Frame-Options:DENY (correct section — [security], not [server])
  #     - GF_SECURITY_COOKIE_SAMESITE=none  # let auth cookies work in the iframe (anonymous view doesn't need this)
  #     - GF_SERVER_CSP_CONTENT_SECURITY_POLICY=frame-ancestors 'self' http://localhost:1420 tauri://localhost  # relax CSP frame-ancestors for the Tauri webview origin
  #   depends_on:
  #     prometheus:
  #       condition: service_started

  backend:
    build:
      context: ./api/backend # assumes Dockerfile is in the root directory
    restart: always
    platform: linux/amd64
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - SERVER_HOST=0.0.0.0
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@db:5432/${DB_DB}
      - BEARER_TOKEN=${BACKEND_BEARER_TOKEN}
      - RUST_BACKTRACE=full
      - LLM_SERVICE_URL=http://llm_service:8001
      - TRADING_BOT_URL=${TRADING_BOT_URL}
      - PROMETHEUS_URL=http://prometheus:9090
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
    ports:
      - 3000:3000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--tries=1",
          "-qO-",
          "http://localhost:3000/check-health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      llm_service:
        condition: service_healthy
    volumes:
      - knowledge_base:/data/knowledge_base
      - scraped_articles:/data/scraped_articles

  db:
    image: timescale/timescaledb:latest-pg17
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data # Mount a volume for persistent PostgreSQL data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PW}
      - POSTGRES_DB=${DB_DB}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-db:
    image: timescale/timescaledb:latest-pg17
    restart: "no"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PW}
      - POSTGRES_DB=${DB_DB}
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-trading-bot:
    restart: "no"
    build:
      context: ./trading/trading-app
      dockerfile: Dockerfile.test
    platform: linux/amd64
    volumes:
      - ib-volume:/home/tws
      - test-orders-data:/data/orders
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@test-db:5432/${DB_DB}
      - TEST_TRADING_DB_URL=postgresql://${DB_USER}:${DB_PW}@test-db:5432/${DB_DB}
      - DATABASE_HOST=test-db
      - DB_USERNAME=${DB_USER}
      - DB_PW=${DB_PW}
      - DB_DB=${DB_DB}
      - DISPLAY=:99
      - SERVER_URL=0.0.0.0:8000
      - SQLX_OFFLINE=true
      - RUST_BACKTRACE=1
      - RUST_LOG=info
      - TRADING_TYPE=paper
      - ORDERS_FILE_PATH=/data/orders/orders.redb
    ports:
      - 4001:4002
      - 7462:7462
      - 8000:8000
    depends_on:
      tws:
        condition: service_started
      test-db:
        condition: service_healthy

  # ── Backtester ───────────────────────────────────────────────────────────
  # One-shot service: builds the `backtest` binary (--features backtest),
  # runs migrations + data loader (IBKR via with_gateway_retry, Alpaca
  # fallback) + replayer (real on_bar_update + handle_bar_update_outcome) +
  # results. Writes backtest_results.json to ./backtest-results/ on the host.
  backtester:
    restart: "no"
    build:
      context: ./trading/trading-app
      dockerfile: Dockerfile.backtest
    platform: linux/amd64
    volumes:
      - ib-volume:/home/tws
      - ./data/backtest-results:/data
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@test-db:5432/${DB_DB}
      - TEST_TRADING_DB_URL=postgresql://${DB_USER}:${DB_PW}@test-db:5432/${DB_DB}
      - DATABASE_HOST=test-db
      - DB_USER=${DB_USER}
      - DB_PW=${DB_PW}
      - DB_DB=${DB_DB}
      - DISPLAY=:99
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - RUST_BACKTRACE=1
      - RUST_LOG=info
    depends_on:
      test-db:
        condition: service_healthy

  optimizer:
    restart: "no"
    build:
      context: .
      dockerfile: ./trading/optimizer/Dockerfile
    platform: linux/amd64
    volumes:
      - ib-volume:/home/tws
      - ./data/optimizer-runs:/data
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PW}@test-db:5432/${DB_DB}
      - DATABASE_HOST=test-db
      - DB_USER=${DB_USER}
      - DB_PW=${DB_PW}
      - DB_DB=${DB_DB}
      - DISPLAY=:99
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - RUST_BACKTRACE=1
      - RUST_LOG=info
    depends_on:
      test-db:
        condition: service_healthy

  # ── Rust Playwright scraper ───────────────────────────────────────────────
  scraper:
    build:
      context: ./ai/scraper
    shm_size: "2gb"
    environment:
      - ARTICLES_PATH=/data/scraped_articles
      - LLM_SERVICE_URL=http://llm_service:8001
      - BEARER_TOKEN=${BACKEND_BEARER_TOKEN}
      - PLAYWRIGHT_BROWSERS_PATH=/home/appuser/.cache/ms-playwright
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - scraped_articles:/data/scraped_articles
      - playwright_cache:/home/appuser/.cache/ms-playwright
    depends_on:
      llm_service:
        condition: service_healthy
    restart: unless-stopped

  # ── Python LLM orchestration service ─────────────────────────────────────
  llm_service:
    build:
      context: ./ai/llm_service
    ports:
      - 8001:8001 # internal only — not exposed to external network
    environment:
      - KNOWLEDGE_BASE_PATH=/data/knowledge_base
      - ARTICLES_PATH=/data/scraped_articles
      - SETTINGS_PATH=/data/settings
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BACKEND_URL=http://backend:3000
      - BEARER_TOKEN=${BACKEND_BEARER_TOKEN}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
    volumes:
      - knowledge_base:/data/knowledge_base
      - scraped_articles:/data/scraped_articles
      - llm_settings:/data/settings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  autoheal:
    deploy:
      replicas: 1
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
      - TZ=Asia/Singapore
    image: willfarrell/autoheal:latest
    network_mode: none
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # ── 1-min bar puller (multi-resolution backtest data) ─────────────────────
  # One-shot: connects to the `tws` IB Gateway (paper, port 4002) and writes
  # 1-min RTH bars to /data/raw_1min_bars.parquet (matching raw_bars.parquet's
  # format) — for the multi-resolution backtest (resolve the ORB's intrabar
  # path on 1-min data instead of 5-min OHLC). Resumable (skips already-pulled
  # chunks). Run: `docker compose run --rm pull-1min`
  pull-1min:
    restart: "no"
    build:
      context: ./scripts
      dockerfile: Dockerfile.pull_1min
    network_mode: host  # reach the tws IB Gateway on localhost:4002
    environment:
      - IB_HOST=127.0.0.1
      - IB_PORT=4002
      - IB_CLIENT_ID=15
      - START_DATE=${PULL_START:-2024-01-01}
      - END_DATE=${PULL_END:-2026-06-30}
      - CHUNK_DAYS=60
      - THROTTLE=0.5
      - OUTPUT=/data/backtest-results/stats/raw_1min_bars.parquet
    volumes:
      - ./data:/data
    depends_on:
      tws:
        condition: service_started

volumes:
  ib-volume:
    driver: local

  # For storing backed up orders for FX
  orders-data:
    driver: local
  pgdata:
    driver: local
  test-orders-data:
    driver: local
  knowledge_base:
    driver: local
  scraped_articles:
    driver: local
  llm_settings:
    driver: local
  playwright_cache:
    driver: local
  # AlertManager state (silences, notification log)
  alertmanager-data:
    driver: local
  # Grafana (optional — uncomment the grafana service above to use)
  grafana-data:
    driver: local
  # Prometheus TSDB
  prometheus-data:
    driver: local
