[package]
name = "optimizer"
version = "0.1.0"
edition = "2024"

[dependencies]
trading-app = { path = "../trading-app", features = ["backtest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
num_cpus = "1.16"
rand = "0.9"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "optimize"
path = "src/bin/optimize.rs"
