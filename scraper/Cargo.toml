[package]
name = "news-scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
feed-rs = "2.3.1"
hex = "0.4.3"
html2text = "0.17.1"
playwright-rs = "0.12.3"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = "1.52.2"
tokio-cron-scheduler = "0.15.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
